name: Regression ML Project CI/CD Pipeline

on:
  push: 
    branches: ["master"]

jobs:
  Compial-and-UniTest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cach: "pip"
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt

      - name: Run Tests With pytest
        run: | 
          pytest
          
      - name: Build Docker Image
        run: |
          docker build -f src/Dockerfile -t ml-regression:latest src/
          
      - name: Login To Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Push Docker Image to Docker Hub
        run: |
          docker tag ml-regression:latest ${{ secrets.DOCKER_HUB_USERNAME }}/ml-regression:latest
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/ml-regression:latest
          
